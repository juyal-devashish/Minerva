[tool.poetry]
name = "minerva-backend"
version = "0.1.0"
description = "Minerva - AI-powered contextual news intelligence platform"
authors = ["Minerva Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = "^5.0.0"
httpx = "^0.26.0"
openai = "^1.10.0"
pinecone-client = "^3.0.0"
spacy = "^3.7.0"
feedparser = "^6.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.1.0"
rapidfuzz = "^3.6.0"
datasketch = "^1.6.0"
apscheduler = "^3.10.0"
python-dotenv = "^1.0.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.40.0"}
aiosqlite = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
ruff = "^0.2.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/prompts/templates.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
