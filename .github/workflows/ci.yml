name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: minerva
          POSTGRES_PASSWORD: minerva_test
          POSTGRES_DB: minerva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          cd backend
          poetry install

      - name: Lint
        run: |
          cd backend
          poetry run ruff check .

      - name: Type check
        run: |
          cd backend
          poetry run ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://minerva:minerva_test@localhost:5432/minerva_test
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: test
          OPENAI_API_KEY: sk-test-key
          PINECONE_API_KEY: test-key
          PINECONE_INDEX: test-index
        run: |
          cd backend
          poetry run pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
